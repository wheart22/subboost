name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subboost-data-mutations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
      CONFIG_KV_NAMESPACE_ID: ${{ secrets.CONFIG_KV_NAMESPACE_ID }}
      RULES_KV_NAMESPACE_ID: ${{ secrets.RULES_KV_NAMESPACE_ID }}
      SUBSCRIPTION_WORKER_URL: ${{ vars.SUBSCRIPTION_WORKER_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate management password secret
        shell: bash
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ "${#APP_PASSWORD}" -lt 12 ]; then
            echo "::error::Add APP_PASSWORD as a GitHub Actions secret with at least 12 characters."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npm --workspace @subboost/local run db:migrate
      - name: Create the single owner record
        run: npx tsx local/scripts/seed-owner.ts
      - name: Render and deploy the public configuration Worker
        run: |
          node local/scripts/render-wrangler-config.mjs config-worker
          npx wrangler deploy --config cloudflare/config-worker/wrangler.jsonc
      - name: Build management Worker with OpenNext
        run: npm run build:cloudflare
      - name: Render management Worker config
        run: node local/scripts/render-wrangler-config.mjs management
      - name: Deploy the management Worker
        run: npx wrangler deploy --config local/wrangler.jsonc
      - name: Set Worker encryption secrets
        shell: bash
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          printf '%s' "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY --config local/wrangler.jsonc
          printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD --config local/wrangler.jsonc
          printf '%s' "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY --config cloudflare/config-worker/wrangler.jsonc
      - name: Backfill encrypted configuration snapshots
        run: npx tsx local/scripts/backfill-config-snapshots.ts
      - name: Refresh the persisted rule index
        run: npx tsx local/scripts/update-rules-index.ts
